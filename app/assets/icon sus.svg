<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Soft background -->
  <rect width="64" height="64" rx="14" fill="#F4F9F4" />
  
  <!-- Clock face -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#2E3440" stroke-width="4" />
  
  <!-- The "Green Window" segment (12 o'clock to ~4 o'clock) -->
  <path d="M32 12 A 20 20 0 0 1 49.3 22 L32 32 Z" fill="#4CAF50" />
  
  <!-- Tiny sun inside the green window -->
  <circle cx="42" cy="20" r="2.5" fill="#FFC107" />
  <line x1="42" y1="15" x2="42" y2="16.5" stroke="#FFC107" stroke-width="1.5" stroke-linecap="round" />
  <line x1="42" y1="23.5" x2="42" y2="25" stroke="#FFC107" stroke-width="1.5" stroke-linecap="round" />
  <line x1="47" y1="20" x2="48.5" y2="20" stroke="#FFC107" stroke-width="1.5" stroke-linecap="round" />
  <line x1="35.5" y1="20" x2="37" y2="20" stroke="#FFC107" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Clock hands -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#2E3440" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="32" x2="24" y2="32" stroke="#2E3440" stroke-width="3" stroke-linecap="round" />
</svg>
